# Netlify publica la web tal cual desde la raiz del repositorio (no hay que compilar nada).
# Las cabeceras de seguridad estan en _headers. Cada pagina mantiene ademas su propia
# Content-Security-Policy en <meta>, que sigue siendo la que limita scripts y estilos.
[build]
  publish = "."
  command = "echo 'Web estatica: nada que compilar'"

# urnalia.com y www.urnalia.com redirigen permanentemente a urnalia.es (una sola web para Google)
[[redirects]]
  from = "https://urnalia.com/*"
  to = "https://urnalia.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.urnalia.com/*"
  to = "https://urnalia.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://urnalia.com/*"
  to = "https://urnalia.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.urnalia.com/*"
  to = "https://urnalia.es/:splat"
  status = 301
  force = true
